<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flocking — Caulde-Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f1116;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #d4d4d8;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .overlay {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: rgba(15, 17, 22, 0.7);
      backdrop-filter: blur(6px);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      max-width: 22rem;
      pointer-events: none;
    }
    .overlay h1 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }
    .overlay p { margin: 0; color: #a1a1aa; line-height: 1.4; }

    .toolbar {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.4rem;
      padding: 0.5rem;
      background: rgba(15, 17, 22, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .toolbar button {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #d4d4d8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
      font-size: 0.8rem;
    }
    .toolbar button:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .toolbar button:active { transform: scale(0.95); }
    .toolbar button.active {
      background: rgba(125, 211, 252, 0.18);
      border-color: rgba(125, 211, 252, 0.55);
      color: #fff;
    }
    .toolbar button[data-tool="inspect"].active {
      background: rgba(252, 211, 77, 0.18);
      border-color: rgba(252, 211, 77, 0.55);
    }
    .toolbar button svg { display: block; }
    .toolbar .sep {
      width: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 4px 2px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="overlay">
    <h1>Flocking simulation</h1>
    <p>Each boid follows three local rules: separation, alignment, cohesion. Place obstacles, repel from your mouse, or toggle inspect to see what some boids are thinking.</p>
  </div>
  <div class="toolbar" id="toolbar">
    <button data-tool="circle" title="Place circle">
      <svg width="22" height="22" viewBox="-12 -12 24 24"><circle r="9" fill="currentColor"/></svg>
    </button>
    <button data-tool="square" title="Place square">
      <svg width="22" height="22" viewBox="-12 -12 24 24"><rect x="-9" y="-9" width="18" height="18" fill="currentColor"/></svg>
    </button>
    <button data-tool="triangle" title="Place triangle">
      <svg width="22" height="22" viewBox="-12 -12 24 24"><polygon points="0,-9 7.79,4.5 -7.79,4.5" fill="currentColor"/></svg>
    </button>
    <div class="sep"></div>
    <button data-tool="repel" title="Repel from mouse">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="0" cy="0" r="2.5" fill="currentColor" stroke="none"/>
        <path d="M 0 -5.5 L 0 -8.5 M 0 5.5 L 0 8.5 M -5.5 0 L -8.5 0 M 5.5 0 L 8.5 0 M -3.9 -3.9 L -6 -6 M 3.9 -3.9 L 6 -6 M -3.9 3.9 L -6 6 M 3.9 3.9 L 6 6"/>
      </svg>
    </button>
    <div class="sep"></div>
    <button data-tool="inspect" title="Inspect — show what some boids are thinking">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M -10 0 Q 0 -7 10 0 Q 0 7 -10 0 Z"/>
        <circle cx="0" cy="0" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div class="sep"></div>
    <button data-tool="clear" title="Clear all obstacles">Clear</button>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function viewW() { return window.innerWidth; }
    function viewH() { return window.innerHeight; }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = viewW() * dpr;
      canvas.height = viewH() * dpr;
      canvas.style.width = viewW() + 'px';
      canvas.style.height = viewH() + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const NUM_BOIDS = 180;
    const VISUAL_RANGE = 150;
    const PROTECTED_RANGE = 18;
    const MAX_SPEED = 2.8;
    const MIN_SPEED = 1.4;
    const ALIGN_FACTOR = 0.04;
    const COHESION_FACTOR = 0.0006;
    const SEPARATION_FACTOR = 0.05;
    const TURN_FACTOR = 0.15;
    const EDGE_MARGIN = 90;

    const LOOK_AHEAD = 45;

    const OBSTACLE_REPEL_RANGE = 45;
    const OBSTACLE_REPEL_FORCE = 0.08;
    const OBSTACLE_SIZE = 38;

    const MOUSE_REPEL_RANGE = 130;
    const MOUSE_REPEL_FORCE = 0.55;

    const TRAIL_FADE = 0.10;
    const INSPECT_EVERY = 30;

    let activeTool = null;
    let inspectOn = false;
    const obstacles = [];
    const mouse = { x: null, y: null, over: false };

    const boids = [];
    for (let i = 0; i < NUM_BOIDS; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
      boids.push({
        x: Math.random() * viewW(),
        y: Math.random() * viewH(),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        hue: 190 + Math.random() * 40,
      });
    }

    function makeObstacle(type, x, y) {
      const o = { type, x, y, size: OBSTACLE_SIZE };
      if (type === 'triangle') {
        const k = Math.sqrt(3);
        o.verts = [
          { x: x,                       y: y - OBSTACLE_SIZE },
          { x: x + OBSTACLE_SIZE * k/2, y: y + OBSTACLE_SIZE/2 },
          { x: x - OBSTACLE_SIZE * k/2, y: y + OBSTACLE_SIZE/2 },
        ];
      }
      return o;
    }

    function sdfCircle(px, py, cx, cy, r) {
      return Math.hypot(px - cx, py - cy) - r;
    }
    function sdfBox(px, py, cx, cy, hs) {
      const dx = Math.abs(px - cx) - hs;
      const dy = Math.abs(py - cy) - hs;
      return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0);
    }
    function sdfTriangle(px, py, verts) {
      let minD = Infinity;
      for (let i = 0; i < 3; i++) {
        const a = verts[i], b = verts[(i + 1) % 3];
        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = px - a.x, apy = py - a.y;
        const lenSq = abx * abx + aby * aby;
        const t = Math.max(0, Math.min(1, (apx * abx + apy * aby) / lenSq));
        const px2 = a.x + abx * t, py2 = a.y + aby * t;
        const d = Math.hypot(px - px2, py - py2);
        if (d < minD) minD = d;
      }
      const s0 = (px - verts[1].x) * (verts[0].y - verts[1].y) - (verts[0].x - verts[1].x) * (py - verts[1].y);
      const s1 = (px - verts[2].x) * (verts[1].y - verts[2].y) - (verts[1].x - verts[2].x) * (py - verts[2].y);
      const s2 = (px - verts[0].x) * (verts[2].y - verts[0].y) - (verts[2].x - verts[0].x) * (py - verts[0].y);
      const inside = (s0 > 0 && s1 > 0 && s2 > 0) || (s0 < 0 && s1 < 0 && s2 < 0);
      return inside ? -minD : minD;
    }
    function obstacleSDF(o, px, py) {
      if (o.type === 'circle')   return sdfCircle(px, py, o.x, o.y, o.size);
      if (o.type === 'square')   return sdfBox(px, py, o.x, o.y, o.size);
      if (o.type === 'triangle') return sdfTriangle(px, py, o.verts);
      return Infinity;
    }
    function obstacleRepelAt(o, px, py) {
      const d = obstacleSDF(o, px, py);
      if (d >= OBSTACLE_REPEL_RANGE) return [0, 0];
      const eps = 1.5;
      const gx = obstacleSDF(o, px + eps, py) - d;
      const gy = obstacleSDF(o, px, py + eps) - d;
      const len = Math.hypot(gx, gy) || 1;
      const strength = Math.max(0, OBSTACLE_REPEL_RANGE - d) * OBSTACLE_REPEL_FORCE;
      return [(gx / len) * strength, (gy / len) * strength];
    }

    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left;
      mouse.y = e.clientY - r.top;
      mouse.over = true;
    });
    canvas.addEventListener('mouseleave', () => { mouse.over = false; });
    canvas.addEventListener('click', (e) => {
      if (!activeTool || activeTool === 'repel') return;
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      obstacles.push(makeObstacle(activeTool, x, y));
    });

    const toolbar = document.getElementById('toolbar');
    const placementButtons = toolbar.querySelectorAll('button[data-tool="circle"], button[data-tool="square"], button[data-tool="triangle"], button[data-tool="repel"]');
    toolbar.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tool = btn.dataset.tool;
        if (tool === 'clear') {
          obstacles.length = 0;
          return;
        }
        if (tool === 'inspect') {
          inspectOn = !inspectOn;
          btn.classList.toggle('active', inspectOn);
          return;
        }
        activeTool = (activeTool === tool) ? null : tool;
        placementButtons.forEach(b => {
          b.classList.toggle('active', b.dataset.tool === activeTool);
        });
        if (activeTool === 'repel')      canvas.style.cursor = 'crosshair';
        else if (activeTool)             canvas.style.cursor = 'copy';
        else                             canvas.style.cursor = 'default';
      });
    });

    function step() {
      const w = viewW(), h = viewH();
      for (const b of boids) {
        let closeDx = 0, closeDy = 0;
        let avgVx = 0, avgVy = 0;
        let avgX = 0, avgY = 0;
        let neighbors = 0;

        for (const other of boids) {
          if (other === b) continue;
          const dx = b.x - other.x;
          const dy = b.y - other.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < PROTECTED_RANGE * PROTECTED_RANGE) {
            closeDx += dx;
            closeDy += dy;
          } else if (distSq < VISUAL_RANGE * VISUAL_RANGE) {
            avgVx += other.vx;
            avgVy += other.vy;
            avgX += other.x;
            avgY += other.y;
            neighbors++;
          }
        }

        if (neighbors > 0) {
          avgVx /= neighbors;
          avgVy /= neighbors;
          avgX /= neighbors;
          avgY /= neighbors;
          b.vx += (avgVx - b.vx) * ALIGN_FACTOR + (avgX - b.x) * COHESION_FACTOR;
          b.vy += (avgVy - b.vy) * ALIGN_FACTOR + (avgY - b.y) * COHESION_FACTOR;
        }
        b.vx += closeDx * SEPARATION_FACTOR;
        b.vy += closeDy * SEPARATION_FACTOR;

        if (obstacles.length > 0) {
          const speed = Math.hypot(b.vx, b.vy) || 1;
          const ahead_x = b.x + (b.vx / speed) * LOOK_AHEAD;
          const ahead_y = b.y + (b.vy / speed) * LOOK_AHEAD;
          for (const o of obstacles) {
            const [fx1, fy1] = obstacleRepelAt(o, b.x, b.y);
            const [fx2, fy2] = obstacleRepelAt(o, ahead_x, ahead_y);
            b.vx += fx1 + fx2 * 0.7;
            b.vy += fy1 + fy2 * 0.7;
          }
        }

        if (activeTool === 'repel' && mouse.over && mouse.x !== null) {
          const dx = b.x - mouse.x;
          const dy = b.y - mouse.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < MOUSE_REPEL_RANGE * MOUSE_REPEL_RANGE && distSq > 0.01) {
            const dist = Math.sqrt(distSq);
            const strength = (1 - dist / MOUSE_REPEL_RANGE) * MOUSE_REPEL_FORCE;
            b.vx += (dx / dist) * strength;
            b.vy += (dy / dist) * strength;
          }
        }

        if (b.x < EDGE_MARGIN)         b.vx += TURN_FACTOR;
        if (b.x > w - EDGE_MARGIN)     b.vx -= TURN_FACTOR;
        if (b.y < EDGE_MARGIN)         b.vy += TURN_FACTOR;
        if (b.y > h - EDGE_MARGIN)     b.vy -= TURN_FACTOR;

        const speed = Math.hypot(b.vx, b.vy);
        if (speed > MAX_SPEED) {
          b.vx = (b.vx / speed) * MAX_SPEED;
          b.vy = (b.vy / speed) * MAX_SPEED;
        } else if (speed < MIN_SPEED && speed > 0) {
          b.vx = (b.vx / speed) * MIN_SPEED;
          b.vy = (b.vy / speed) * MIN_SPEED;
        }

        b.x += b.vx;
        b.y += b.vy;
      }
    }

    function drawObstacle(o) {
      ctx.fillStyle = 'rgba(244, 114, 182, 0.55)';
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (o.type === 'circle') {
        ctx.arc(o.x, o.y, o.size, 0, Math.PI * 2);
      } else if (o.type === 'square') {
        ctx.rect(o.x - o.size, o.y - o.size, o.size * 2, o.size * 2);
      } else if (o.type === 'triangle') {
        ctx.moveTo(o.verts[0].x, o.verts[0].y);
        ctx.lineTo(o.verts[1].x, o.verts[1].y);
        ctx.lineTo(o.verts[2].x, o.verts[2].y);
        ctx.closePath();
      }
      ctx.fill();
      ctx.stroke();
    }

    function drawInspectOverlay() {
      const watched = [];
      for (let i = Math.floor(INSPECT_EVERY / 2); i < boids.length; i += INSPECT_EVERY) {
        watched.push(boids[i]);
      }

      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(252, 211, 77, 0.10)';
      for (const b of watched) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, VISUAL_RANGE, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(244, 114, 182, 0.20)';
      for (const b of watched) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, PROTECTED_RANGE, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(252, 211, 77, 0.22)';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      const visualSq = VISUAL_RANGE * VISUAL_RANGE;
      for (const b of watched) {
        for (const other of boids) {
          if (other === b) continue;
          const dx = b.x - other.x, dy = b.y - other.y;
          if (dx * dx + dy * dy < visualSq) {
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(other.x, other.y);
          }
        }
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(252, 211, 77, 0.85)';
      ctx.lineWidth = 1.4;
      ctx.fillStyle = 'rgba(252, 211, 77, 0.9)';
      for (const b of watched) {
        const speed = Math.hypot(b.vx, b.vy) || 1;
        const ax = b.x + (b.vx / speed) * LOOK_AHEAD;
        const ay = b.y + (b.vy / speed) * LOOK_AHEAD;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(ax, ay);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ax, ay, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(252, 211, 77, 0.9)';
      ctx.lineWidth = 1.2;
      for (const b of watched) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.fillStyle = `rgba(15, 17, 22, ${TRAIL_FADE})`;
      ctx.fillRect(0, 0, viewW(), viewH());

      for (const b of boids) {
        const angle = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(angle);
        ctx.fillStyle = `hsl(${b.hue}, 80%, 65%)`;
        ctx.beginPath();
        ctx.moveTo(9, 0);
        ctx.lineTo(-6, 5);
        ctx.lineTo(-6, -5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      for (const o of obstacles) drawObstacle(o);

      if (activeTool === 'repel' && mouse.over && mouse.x !== null) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, MOUSE_REPEL_RANGE, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (inspectOn) drawInspectOverlay();
    }

    function loop() {
      step();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
