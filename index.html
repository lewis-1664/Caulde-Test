<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flocking — Caulde-Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f1116;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #d4d4d8;
      user-select: none;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #overlay-canvas {
      pointer-events: none;
    }
    .overlay {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: rgba(15, 17, 22, 0.7);
      backdrop-filter: blur(6px);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      max-width: 22rem;
      pointer-events: none;
    }
    .overlay h1 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }
    .overlay p { margin: 0; color: #a1a1aa; line-height: 1.4; }

    .settings {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: rgba(15, 17, 22, 0.85);
      backdrop-filter: blur(6px);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .settings label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .settings input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
    }
    .settings input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #7dd3fc;
      border-radius: 50%;
      cursor: pointer;
    }
    .settings input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #7dd3fc;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .settings .value {
      min-width: 2rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }
    .species-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .species-row .label {
      color: #d4d4d8;
    }
    .species-picker {
      display: flex;
      gap: 0.35rem;
    }
    .species-picker button {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      padding: 0;
      transition: border-color 0.15s, transform 0.05s;
    }
    .species-picker button:hover { transform: scale(1.1); }
    .species-picker button.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }

    .stats {
      position: fixed;
      bottom: 1.25rem;
      right: 1rem;
      background: rgba(15, 17, 22, 0.85);
      backdrop-filter: blur(6px);
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 7.5rem;
    }
    .stats-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .stats-row .label {
      flex: 1;
      color: #a1a1aa;
    }
    .stats-row .value {
      font-variant-numeric: tabular-nums;
      color: #fff;
      min-width: 2.4rem;
      text-align: right;
    }
    .stats-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .stats-divider {
      margin-top: 0.2rem;
      padding-top: 0.35rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toolbar {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.4rem;
      padding: 0.5rem;
      background: rgba(15, 17, 22, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .toolbar button {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #d4d4d8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
      font-size: 0.8rem;
    }
    .toolbar button:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .toolbar button:active { transform: scale(0.95); }
    .toolbar button.active {
      background: rgba(125, 211, 252, 0.18);
      border-color: rgba(125, 211, 252, 0.55);
      color: #fff;
    }
    .toolbar button[data-tool="add"].active {
      background: rgba(134, 239, 172, 0.18);
      border-color: rgba(134, 239, 172, 0.55);
    }
    .toolbar button[data-tool="remove"].active {
      background: rgba(252, 165, 165, 0.18);
      border-color: rgba(252, 165, 165, 0.55);
    }
    .toolbar button[data-tool="inspect"].active {
      background: rgba(252, 211, 77, 0.18);
      border-color: rgba(252, 211, 77, 0.55);
    }
    .toolbar button svg { display: block; }
    .toolbar .sep {
      width: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 4px 2px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="overlay-canvas"></canvas>
  <div class="overlay">
    <h1>Flocking simulation</h1>
    <p>Three species flock with their own kind and avoid the others. Place obstacles, brush boids in or out (target species set top-right), repel from your mouse, or toggle inspect.</p>
  </div>
  <div class="settings">
    <label>
      View range
      <input type="range" id="visual-range" min="30" max="300" value="150" step="1">
      <span class="value" id="visual-range-value">150</span>
    </label>
    <label>
      Avoid range
      <input type="range" id="avoid-range" min="20" max="300" value="38" step="1">
      <span class="value" id="avoid-range-value">38</span>
    </label>
    <label>
      Look-ahead
      <input type="range" id="look-ahead" min="0" max="200" value="45" step="1">
      <span class="value" id="look-ahead-value">45</span>
    </label>
    <div class="species-row">
      <span class="label">Species</span>
      <div class="species-picker" id="species-picker">
        <button data-species="0" title="Sky" style="background: hsl(207, 80%, 65%);"></button>
        <button data-species="1" title="Sun" style="background: hsl(35, 85%, 60%);"></button>
        <button data-species="2" title="Lime" style="background: hsl(115, 65%, 58%);"></button>
      </div>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
    <button data-tool="pause" title="Pause / play (space)">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="currentColor" id="icon-pause">
        <rect x="-6" y="-7" width="4" height="14"/>
        <rect x="2" y="-7" width="4" height="14"/>
      </svg>
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="currentColor" id="icon-play" style="display:none">
        <polygon points="-5,-7 -5,7 7,0"/>
      </svg>
    </button>
    <div class="sep"></div>
    <button data-tool="circle" title="Place circle">
      <svg width="22" height="22" viewBox="-12 -12 24 24"><circle r="9" fill="currentColor"/></svg>
    </button>
    <button data-tool="square" title="Place square">
      <svg width="22" height="22" viewBox="-12 -12 24 24"><rect x="-9" y="-9" width="18" height="18" fill="currentColor"/></svg>
    </button>
    <button data-tool="triangle" title="Place triangle">
      <svg width="22" height="22" viewBox="-12 -12 24 24"><polygon points="0,-9 7.79,4.5 -7.79,4.5" fill="currentColor"/></svg>
    </button>
    <div class="sep"></div>
    <button data-tool="add" title="Add boids of selected species (click or drag)">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M 0 -7.5 L 0 7.5 M -7.5 0 L 7.5 0"/>
      </svg>
    </button>
    <button data-tool="remove" title="Remove boids of selected species (click or drag)">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M -7.5 0 L 7.5 0"/>
      </svg>
    </button>
    <div class="sep"></div>
    <button data-tool="repel" title="Repel from mouse">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="0" cy="0" r="2.5" fill="currentColor" stroke="none"/>
        <path d="M 0 -5.5 L 0 -8.5 M 0 5.5 L 0 8.5 M -5.5 0 L -8.5 0 M 5.5 0 L 8.5 0 M -3.9 -3.9 L -6 -6 M 3.9 -3.9 L 6 -6 M -3.9 3.9 L -6 6 M 3.9 3.9 L 6 6"/>
      </svg>
    </button>
    <div class="sep"></div>
    <button data-tool="inspect" title="Inspect — show what some boids are thinking">
      <svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M -10 0 Q 0 -7 10 0 Q 0 7 -10 0 Z"/>
        <circle cx="0" cy="0" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div class="sep"></div>
    <button data-tool="clear" title="Clear all obstacles">Clear</button>
  </div>
  <div class="stats" id="stats">
    <div class="stats-row">
      <span class="label">Total</span>
      <span class="value" id="stats-total">180</span>
    </div>
    <div class="stats-row">
      <span class="stats-dot" style="background: hsl(207, 80%, 65%);"></span>
      <span class="label">Sky</span>
      <span class="value" id="stats-0">60</span>
    </div>
    <div class="stats-row">
      <span class="stats-dot" style="background: hsl(35, 85%, 60%);"></span>
      <span class="label">Sun</span>
      <span class="value" id="stats-1">60</span>
    </div>
    <div class="stats-row">
      <span class="stats-dot" style="background: hsl(115, 65%, 58%);"></span>
      <span class="label">Lime</span>
      <span class="value" id="stats-2">60</span>
    </div>
    <div class="stats-row stats-divider">
      <span class="label">FPS</span>
      <span class="value" id="stats-fps">60</span>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');

    function viewW() { return window.innerWidth; }
    function viewH() { return window.innerHeight; }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      for (const cv of [canvas, overlayCanvas]) {
        cv.width = viewW() * dpr;
        cv.height = viewH() * dpr;
        cv.style.width = viewW() + 'px';
        cv.style.height = viewH() + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const SPECIES = [
      { name: 'Sky',  hueMin: 195, hueMax: 220, centerHue: 207 },
      { name: 'Sun',  hueMin: 25,  hueMax: 45,  centerHue: 35 },
      { name: 'Lime', hueMin: 105, hueMax: 125, centerHue: 115 },
    ];
    const SPECIES_LIGHT = [65, 60, 58];
    const SPECIES_SAT = [80, 85, 65];

    const NUM_BOIDS = 180;
    let VISUAL_RANGE = 150;
    const PROTECTED_RANGE = 18;
    let DIFF_SPECIES_RANGE = 38;
    const SPECIES_PARAMS = [
      { maxSpeed: 2.8, minSpeed: 1.4, alignFactor: 0.030, cohesionFactor: 0.0005,  separationFactor: 0.50, turnFactor: 0.15 },
      { maxSpeed: 4.0, minSpeed: 2.0, alignFactor: 0.010, cohesionFactor: 0.00012, separationFactor: 0.80, turnFactor: 0.22 },
      { maxSpeed: 1.5, minSpeed: 0.8, alignFactor: 0.080, cohesionFactor: 0.0016,  separationFactor: 0.30, turnFactor: 0.10 },
    ];
    const DIFF_SPECIES_FACTOR = 0.5;
    const EDGE_MARGIN = 90;

    let LOOK_AHEAD = 45;
    const ARC_PROBE_COUNT = 5;
    const ARC_HALF_ANGLE_RAD = 50 * Math.PI / 180;
    const ARC_PROBE_WEIGHT = 0.25;
    const MAX_AVOID_FORCE = 0.6;

    const OBSTACLE_REPEL_RANGE = 45;
    const OBSTACLE_REPEL_FORCE = 0.08;
    const OBSTACLE_SIZE = 38;

    const MOUSE_REPEL_RANGE = 130;
    const MOUSE_REPEL_FORCE = 0.55;

    const ADD_BRUSH_RADIUS = 22;
    const REMOVE_BRUSH_RADIUS = 45;
    const ADD_PER_CLICK = 5;
    const ADD_PER_DRAG_TICK = 1;
    const BRUSH_DRAG_INTERVAL = 70;

    const TRAIL_FADE = 0.10;
    const INSPECT_PER_SPECIES = 2;

    let activeTool = null;
    let activeSpecies = 0;
    let inspectOn = false;
    let paused = false;
    const obstacles = [];
    const mouse = { x: null, y: null, over: false, down: false };
    let lastBrushAt = 0;

    const boids = [];
    function spawnBoid(x, y, spread, species) {
      const p = SPECIES_PARAMS[species];
      const angle = Math.random() * Math.PI * 2;
      const speed = p.minSpeed + Math.random() * (p.maxSpeed - p.minSpeed);
      const offR = Math.random() * spread;
      const offA = Math.random() * Math.PI * 2;
      const s = SPECIES[species];
      const hue = s.hueMin + Math.random() * (s.hueMax - s.hueMin);
      boids.push({
        x: x + Math.cos(offA) * offR,
        y: y + Math.sin(offA) * offR,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        species,
        hue,
      });
    }
    for (let i = 0; i < NUM_BOIDS; i++) {
      spawnBoid(Math.random() * viewW(), Math.random() * viewH(), 0, i % SPECIES.length);
    }

    function addBoidsAt(x, y, count) {
      for (let i = 0; i < count; i++) spawnBoid(x, y, ADD_BRUSH_RADIUS, activeSpecies);
    }
    function removeBoidsAt(x, y) {
      const rSq = REMOVE_BRUSH_RADIUS * REMOVE_BRUSH_RADIUS;
      for (let i = boids.length - 1; i >= 0; i--) {
        if (boids[i].species !== activeSpecies) continue;
        const dx = boids[i].x - x, dy = boids[i].y - y;
        if (dx * dx + dy * dy < rSq) boids.splice(i, 1);
      }
    }

    function makeObstacle(type, x, y) {
      const o = { type, x, y, size: OBSTACLE_SIZE };
      if (type === 'triangle') {
        const k = Math.sqrt(3);
        o.verts = [
          { x: x,                       y: y - OBSTACLE_SIZE },
          { x: x + OBSTACLE_SIZE * k/2, y: y + OBSTACLE_SIZE/2 },
          { x: x - OBSTACLE_SIZE * k/2, y: y + OBSTACLE_SIZE/2 },
        ];
      }
      return o;
    }

    function sdfCircle(px, py, cx, cy, r) {
      return Math.hypot(px - cx, py - cy) - r;
    }
    function sdfBox(px, py, cx, cy, hs) {
      const dx = Math.abs(px - cx) - hs;
      const dy = Math.abs(py - cy) - hs;
      return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0);
    }
    function sdfTriangle(px, py, verts) {
      let minD = Infinity;
      for (let i = 0; i < 3; i++) {
        const a = verts[i], b = verts[(i + 1) % 3];
        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = px - a.x, apy = py - a.y;
        const lenSq = abx * abx + aby * aby;
        const t = Math.max(0, Math.min(1, (apx * abx + apy * aby) / lenSq));
        const px2 = a.x + abx * t, py2 = a.y + aby * t;
        const d = Math.hypot(px - px2, py - py2);
        if (d < minD) minD = d;
      }
      const s0 = (px - verts[1].x) * (verts[0].y - verts[1].y) - (verts[0].x - verts[1].x) * (py - verts[1].y);
      const s1 = (px - verts[2].x) * (verts[1].y - verts[2].y) - (verts[1].x - verts[2].x) * (py - verts[2].y);
      const s2 = (px - verts[0].x) * (verts[2].y - verts[0].y) - (verts[2].x - verts[0].x) * (py - verts[0].y);
      const inside = (s0 > 0 && s1 > 0 && s2 > 0) || (s0 < 0 && s1 < 0 && s2 < 0);
      return inside ? -minD : minD;
    }
    function obstacleSDF(o, px, py) {
      if (o.type === 'circle')   return sdfCircle(px, py, o.x, o.y, o.size);
      if (o.type === 'square')   return sdfBox(px, py, o.x, o.y, o.size);
      if (o.type === 'triangle') return sdfTriangle(px, py, o.verts);
      return Infinity;
    }
    function obstacleRepelAt(o, px, py) {
      const d = obstacleSDF(o, px, py);
      if (d >= OBSTACLE_REPEL_RANGE) return [0, 0];
      const eps = 1.5;
      const gx = obstacleSDF(o, px + eps, py) - d;
      const gy = obstacleSDF(o, px, py + eps) - d;
      const len = Math.hypot(gx, gy) || 1;
      const strength = Math.max(0, OBSTACLE_REPEL_RANGE - d) * OBSTACLE_REPEL_FORCE;
      return [(gx / len) * strength, (gy / len) * strength];
    }

    function eventToCanvas(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }

    canvas.addEventListener('mousemove', (e) => {
      const [x, y] = eventToCanvas(e);
      mouse.x = x; mouse.y = y; mouse.over = true;
      if (mouse.down && (activeTool === 'add' || activeTool === 'remove')) {
        const now = performance.now();
        if (now - lastBrushAt >= BRUSH_DRAG_INTERVAL) {
          lastBrushAt = now;
          if (activeTool === 'add') addBoidsAt(x, y, ADD_PER_DRAG_TICK);
          else removeBoidsAt(x, y);
        }
      }
    });
    canvas.addEventListener('mouseleave', () => { mouse.over = false; });
    window.addEventListener('mouseup', () => { mouse.down = false; });

    canvas.addEventListener('mousedown', (e) => {
      if (!activeTool || activeTool === 'repel') return;
      const [x, y] = eventToCanvas(e);
      if (activeTool === 'circle' || activeTool === 'square' || activeTool === 'triangle') {
        obstacles.push(makeObstacle(activeTool, x, y));
      } else if (activeTool === 'add') {
        mouse.down = true;
        addBoidsAt(x, y, ADD_PER_CLICK);
        lastBrushAt = performance.now();
      } else if (activeTool === 'remove') {
        mouse.down = true;
        removeBoidsAt(x, y);
        lastBrushAt = performance.now();
      }
    });

    const toolbar = document.getElementById('toolbar');
    const placementTools = new Set(['circle', 'square', 'triangle', 'add', 'remove', 'repel']);
    const placementButtons = toolbar.querySelectorAll('button[data-tool="circle"], button[data-tool="square"], button[data-tool="triangle"], button[data-tool="add"], button[data-tool="remove"], button[data-tool="repel"]');
    toolbar.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tool = btn.dataset.tool;
        if (tool === 'clear') {
          obstacles.length = 0;
          return;
        }
        if (tool === 'inspect') {
          inspectOn = !inspectOn;
          btn.classList.toggle('active', inspectOn);
          return;
        }
        if (tool === 'pause') {
          togglePause();
          return;
        }
        if (!placementTools.has(tool)) return;
        activeTool = (activeTool === tool) ? null : tool;
        placementButtons.forEach(b => {
          b.classList.toggle('active', b.dataset.tool === activeTool);
        });
        if (activeTool === 'repel')                              canvas.style.cursor = 'crosshair';
        else if (activeTool === 'add' || activeTool === 'remove') canvas.style.cursor = 'crosshair';
        else if (activeTool)                                     canvas.style.cursor = 'copy';
        else                                                     canvas.style.cursor = 'default';
      });
    });

    const speciesPicker = document.getElementById('species-picker');
    function updateSpeciesPicker() {
      speciesPicker.querySelectorAll('button').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.species, 10) === activeSpecies);
      });
    }
    speciesPicker.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        activeSpecies = parseInt(btn.dataset.species, 10);
        updateSpeciesPicker();
      });
    });
    updateSpeciesPicker();

    const visualRangeSlider = document.getElementById('visual-range');
    const visualRangeValue = document.getElementById('visual-range-value');
    visualRangeSlider.addEventListener('input', () => {
      VISUAL_RANGE = parseInt(visualRangeSlider.value, 10);
      visualRangeValue.textContent = VISUAL_RANGE;
    });

    const avoidRangeSlider = document.getElementById('avoid-range');
    const avoidRangeValue = document.getElementById('avoid-range-value');
    avoidRangeSlider.addEventListener('input', () => {
      DIFF_SPECIES_RANGE = parseInt(avoidRangeSlider.value, 10);
      avoidRangeValue.textContent = DIFF_SPECIES_RANGE;
    });

    const lookAheadSlider = document.getElementById('look-ahead');
    const lookAheadValue = document.getElementById('look-ahead-value');
    lookAheadSlider.addEventListener('input', () => {
      LOOK_AHEAD = parseInt(lookAheadSlider.value, 10);
      lookAheadValue.textContent = LOOK_AHEAD;
    });

    const pauseBtn = toolbar.querySelector('button[data-tool="pause"]');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    function togglePause() {
      paused = !paused;
      iconPause.style.display = paused ? 'none' : 'block';
      iconPlay.style.display  = paused ? 'block' : 'none';
      pauseBtn.classList.toggle('active', paused);
    }
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        togglePause();
      }
    });

    const statsEls = {
      total: document.getElementById('stats-total'),
      0:     document.getElementById('stats-0'),
      1:     document.getElementById('stats-1'),
      2:     document.getElementById('stats-2'),
      fps:   document.getElementById('stats-fps'),
    };
    let fpsLastTime = performance.now();
    let fpsFrameCount = 0;
    let fpsValue = 60;
    let statsLastUpdate = 0;
    function updateStats(now) {
      if (now - statsLastUpdate < 250) return;
      statsLastUpdate = now;
      const counts = [0, 0, 0];
      for (const b of boids) counts[b.species]++;
      statsEls.total.textContent = boids.length;
      statsEls[0].textContent = counts[0];
      statsEls[1].textContent = counts[1];
      statsEls[2].textContent = counts[2];
      statsEls.fps.textContent = fpsValue;
    }

    function step() {
      const w = viewW(), h = viewH();
      const visualSq = VISUAL_RANGE * VISUAL_RANGE;
      const protectedSq = PROTECTED_RANGE * PROTECTED_RANGE;
      const diffSq = DIFF_SPECIES_RANGE * DIFF_SPECIES_RANGE;
      for (const b of boids) {
        const p = SPECIES_PARAMS[b.species];
        let closeDx = 0, closeDy = 0;
        let avgVx = 0, avgVy = 0;
        let avgX = 0, avgY = 0;
        let neighbors = 0;

        for (const other of boids) {
          if (other === b) continue;
          const dx = b.x - other.x;
          const dy = b.y - other.y;
          const distSq = dx * dx + dy * dy;
          const sameSpecies = other.species === b.species;

          if (sameSpecies) {
            if (distSq < protectedSq) {
              const dist = Math.sqrt(distSq) || 0.01;
              const falloff = 1 - dist / PROTECTED_RANGE;
              closeDx += (dx / dist) * falloff;
              closeDy += (dy / dist) * falloff;
            } else if (distSq < visualSq) {
              avgVx += other.vx;
              avgVy += other.vy;
              avgX += other.x;
              avgY += other.y;
              neighbors++;
            }
          } else if (distSq < diffSq) {
            const dist = Math.sqrt(distSq) || 0.01;
            const falloff = 1 - dist / DIFF_SPECIES_RANGE;
            closeDx += (dx / dist) * falloff * DIFF_SPECIES_FACTOR;
            closeDy += (dy / dist) * falloff * DIFF_SPECIES_FACTOR;
          }
        }

        if (neighbors > 0) {
          avgVx /= neighbors;
          avgVy /= neighbors;
          avgX /= neighbors;
          avgY /= neighbors;
          b.vx += (avgVx - b.vx) * p.alignFactor + (avgX - b.x) * p.cohesionFactor;
          b.vy += (avgVy - b.vy) * p.alignFactor + (avgY - b.y) * p.cohesionFactor;
        }
        b.vx += closeDx * p.separationFactor;
        b.vy += closeDy * p.separationFactor;

        if (obstacles.length > 0) {
          let avoidFx = 0, avoidFy = 0;
          for (const o of obstacles) {
            const [fx, fy] = obstacleRepelAt(o, b.x, b.y);
            avoidFx += fx;
            avoidFy += fy;
          }
          if (LOOK_AHEAD > 0) {
            const heading = Math.atan2(b.vy, b.vx);
            for (let i = 0; i < ARC_PROBE_COUNT; i++) {
              const t = (i / (ARC_PROBE_COUNT - 1) - 0.5) * 2;
              const angle = heading + t * ARC_HALF_ANGLE_RAD;
              const px = b.x + Math.cos(angle) * LOOK_AHEAD;
              const py = b.y + Math.sin(angle) * LOOK_AHEAD;
              for (const o of obstacles) {
                const [fx, fy] = obstacleRepelAt(o, px, py);
                avoidFx += fx * ARC_PROBE_WEIGHT;
                avoidFy += fy * ARC_PROBE_WEIGHT;
              }
            }
          }
          const avoidMag = Math.hypot(avoidFx, avoidFy);
          if (avoidMag > MAX_AVOID_FORCE) {
            const k = MAX_AVOID_FORCE / avoidMag;
            avoidFx *= k;
            avoidFy *= k;
          }
          b.vx += avoidFx;
          b.vy += avoidFy;
        }

        if (activeTool === 'repel' && mouse.over && mouse.x !== null) {
          const dx = b.x - mouse.x;
          const dy = b.y - mouse.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < MOUSE_REPEL_RANGE * MOUSE_REPEL_RANGE && distSq > 0.01) {
            const dist = Math.sqrt(distSq);
            const strength = (1 - dist / MOUSE_REPEL_RANGE) * MOUSE_REPEL_FORCE;
            b.vx += (dx / dist) * strength;
            b.vy += (dy / dist) * strength;
          }
        }

        if (b.x < EDGE_MARGIN)         b.vx += p.turnFactor;
        if (b.x > w - EDGE_MARGIN)     b.vx -= p.turnFactor;
        if (b.y < EDGE_MARGIN)         b.vy += p.turnFactor;
        if (b.y > h - EDGE_MARGIN)     b.vy -= p.turnFactor;

        const speed = Math.hypot(b.vx, b.vy);
        if (speed > p.maxSpeed) {
          b.vx = (b.vx / speed) * p.maxSpeed;
          b.vy = (b.vy / speed) * p.maxSpeed;
        } else if (speed < p.minSpeed && speed > 0) {
          b.vx = (b.vx / speed) * p.minSpeed;
          b.vy = (b.vy / speed) * p.minSpeed;
        }

        b.x += b.vx;
        b.y += b.vy;
      }
    }

    function drawObstacle(o, c) {
      c.fillStyle = 'rgba(244, 114, 182, 0.55)';
      c.strokeStyle = 'rgba(244, 114, 182, 0.95)';
      c.lineWidth = 1.5;
      c.beginPath();
      if (o.type === 'circle') {
        c.arc(o.x, o.y, o.size, 0, Math.PI * 2);
      } else if (o.type === 'square') {
        c.rect(o.x - o.size, o.y - o.size, o.size * 2, o.size * 2);
      } else if (o.type === 'triangle') {
        c.moveTo(o.verts[0].x, o.verts[0].y);
        c.lineTo(o.verts[1].x, o.verts[1].y);
        c.lineTo(o.verts[2].x, o.verts[2].y);
        c.closePath();
      }
      c.fill();
      c.stroke();
    }

    function drawInspectOverlay(c) {
      const watched = [];
      const counts = new Array(SPECIES.length).fill(0);
      for (const b of boids) {
        if (counts[b.species] < INSPECT_PER_SPECIES) {
          watched.push(b);
          counts[b.species]++;
        }
        if (watched.length >= SPECIES.length * INSPECT_PER_SPECIES) break;
      }

      c.lineWidth = 1;
      for (const b of watched) {
        const s = SPECIES[b.species];
        c.strokeStyle = `hsla(${s.centerHue}, 70%, 65%, 0.22)`;
        c.beginPath();
        c.arc(b.x, b.y, VISUAL_RANGE, 0, Math.PI * 2);
        c.stroke();
      }

      c.strokeStyle = 'rgba(244, 114, 182, 0.22)';
      for (const b of watched) {
        c.beginPath();
        c.arc(b.x, b.y, PROTECTED_RANGE, 0, Math.PI * 2);
        c.stroke();
      }

      c.strokeStyle = 'rgba(244, 114, 182, 0.32)';
      c.lineWidth = 0.9;
      c.setLineDash([4, 4]);
      for (const b of watched) {
        c.beginPath();
        c.arc(b.x, b.y, DIFF_SPECIES_RANGE, 0, Math.PI * 2);
        c.stroke();
      }
      c.setLineDash([]);

      c.lineWidth = 0.8;
      const visualSq = VISUAL_RANGE * VISUAL_RANGE;
      for (const b of watched) {
        const s = SPECIES[b.species];
        c.strokeStyle = `hsla(${s.centerHue}, 80%, 72%, 0.55)`;
        c.beginPath();
        for (const other of boids) {
          if (other === b) continue;
          if (other.species !== b.species) continue;
          const dx = b.x - other.x, dy = b.y - other.y;
          if (dx * dx + dy * dy < visualSq) {
            c.moveTo(b.x, b.y);
            c.lineTo(other.x, other.y);
          }
        }
        c.stroke();
      }

      c.strokeStyle = 'rgba(244, 114, 182, 0.85)';
      c.lineWidth = 1.2;
      c.setLineDash([5, 4]);
      c.beginPath();
      const diffSq = DIFF_SPECIES_RANGE * DIFF_SPECIES_RANGE;
      for (const b of watched) {
        for (const other of boids) {
          if (other === b) continue;
          if (other.species === b.species) continue;
          const dx = b.x - other.x, dy = b.y - other.y;
          if (dx * dx + dy * dy < diffSq) {
            c.moveTo(b.x, b.y);
            c.lineTo(other.x, other.y);
          }
        }
      }
      c.stroke();
      c.setLineDash([]);

      for (const b of watched) {
        const heading = Math.atan2(b.vy, b.vx);
        if (LOOK_AHEAD > 0) {
          c.fillStyle = 'rgba(252, 211, 77, 0.07)';
          c.strokeStyle = 'rgba(252, 211, 77, 0.45)';
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(b.x, b.y);
          c.arc(b.x, b.y, LOOK_AHEAD, heading - ARC_HALF_ANGLE_RAD, heading + ARC_HALF_ANGLE_RAD);
          c.closePath();
          c.fill();
          c.stroke();
          c.fillStyle = 'rgba(252, 211, 77, 0.85)';
          for (let i = 0; i < ARC_PROBE_COUNT; i++) {
            const t = (i / (ARC_PROBE_COUNT - 1) - 0.5) * 2;
            const angle = heading + t * ARC_HALF_ANGLE_RAD;
            const ax = b.x + Math.cos(angle) * LOOK_AHEAD;
            const ay = b.y + Math.sin(angle) * LOOK_AHEAD;
            c.beginPath();
            c.arc(ax, ay, 2.5, 0, Math.PI * 2);
            c.fill();
          }
        }
      }

      c.strokeStyle = 'rgba(252, 211, 77, 0.9)';
      c.lineWidth = 1.2;
      for (const b of watched) {
        c.beginPath();
        c.arc(b.x, b.y, 9, 0, Math.PI * 2);
        c.stroke();
      }
    }

    function drawBrushIndicator(c) {
      if (!mouse.over || mouse.x === null) return;
      if (activeTool === 'repel') {
        c.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        c.lineWidth = 1;
        c.beginPath();
        c.arc(mouse.x, mouse.y, MOUSE_REPEL_RANGE, 0, Math.PI * 2);
        c.stroke();
      } else if (activeTool === 'add' || activeTool === 'remove') {
        const r = activeTool === 'add' ? ADD_BRUSH_RADIUS : REMOVE_BRUSH_RADIUS;
        const s = SPECIES[activeSpecies];
        c.strokeStyle = `hsla(${s.centerHue}, 80%, 65%, 0.7)`;
        c.lineWidth = 1.4;
        if (activeTool === 'remove') c.setLineDash([5, 4]);
        c.beginPath();
        c.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
        c.stroke();
        if (activeTool === 'remove') c.setLineDash([]);
      }
    }

    function draw() {
      ctx.fillStyle = `rgba(15, 17, 22, ${TRAIL_FADE})`;
      ctx.fillRect(0, 0, viewW(), viewH());

      for (const b of boids) {
        const angle = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(angle);
        ctx.fillStyle = `hsl(${b.hue}, ${SPECIES_SAT[b.species]}%, ${SPECIES_LIGHT[b.species]}%)`;
        ctx.beginPath();
        ctx.moveTo(9, 0);
        ctx.lineTo(-6, 5);
        ctx.lineTo(-6, -5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      overlayCtx.clearRect(0, 0, viewW(), viewH());
      for (const o of obstacles) drawObstacle(o, overlayCtx);
      drawBrushIndicator(overlayCtx);
      if (inspectOn) drawInspectOverlay(overlayCtx);
    }

    function loop() {
      const now = performance.now();
      fpsFrameCount++;
      if (now - fpsLastTime >= 500) {
        fpsValue = Math.round(fpsFrameCount * 1000 / (now - fpsLastTime));
        fpsLastTime = now;
        fpsFrameCount = 0;
      }
      if (!paused) step();
      draw();
      updateStats(now);
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
