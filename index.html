<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flocking — Caulde-Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f1116;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #d4d4d8;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .overlay {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: rgba(15, 17, 22, 0.7);
      backdrop-filter: blur(6px);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      max-width: 22rem;
      pointer-events: none;
    }
    .overlay h1 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }
    .overlay p { margin: 0; color: #a1a1aa; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="overlay">
    <h1>Flocking simulation</h1>
    <p>Each boid follows three local rules: separation, alignment, and cohesion. The flock-like motion is emergent — no boid knows where the group is going.</p>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const NUM_BOIDS = 180;
    const VISUAL_RANGE = 60;
    const PROTECTED_RANGE = 18;
    const MAX_SPEED = 3.2;
    const MIN_SPEED = 1.6;
    const ALIGN_FACTOR = 0.05;
    const COHESION_FACTOR = 0.0008;
    const SEPARATION_FACTOR = 0.06;
    const TURN_FACTOR = 0.18;
    const EDGE_MARGIN = 90;

    const boids = [];
    function viewW() { return window.innerWidth; }
    function viewH() { return window.innerHeight; }

    for (let i = 0; i < NUM_BOIDS; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
      boids.push({
        x: Math.random() * viewW(),
        y: Math.random() * viewH(),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        hue: 190 + Math.random() * 40,
      });
    }

    function step() {
      const w = viewW(), h = viewH();
      for (const b of boids) {
        let closeDx = 0, closeDy = 0;
        let avgVx = 0, avgVy = 0;
        let avgX = 0, avgY = 0;
        let neighbors = 0;

        for (const other of boids) {
          if (other === b) continue;
          const dx = b.x - other.x;
          const dy = b.y - other.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < PROTECTED_RANGE * PROTECTED_RANGE) {
            closeDx += dx;
            closeDy += dy;
          } else if (distSq < VISUAL_RANGE * VISUAL_RANGE) {
            avgVx += other.vx;
            avgVy += other.vy;
            avgX += other.x;
            avgY += other.y;
            neighbors++;
          }
        }

        if (neighbors > 0) {
          avgVx /= neighbors;
          avgVy /= neighbors;
          avgX /= neighbors;
          avgY /= neighbors;
          b.vx += (avgVx - b.vx) * ALIGN_FACTOR + (avgX - b.x) * COHESION_FACTOR;
          b.vy += (avgVy - b.vy) * ALIGN_FACTOR + (avgY - b.y) * COHESION_FACTOR;
        }

        b.vx += closeDx * SEPARATION_FACTOR;
        b.vy += closeDy * SEPARATION_FACTOR;

        if (b.x < EDGE_MARGIN) b.vx += TURN_FACTOR;
        if (b.x > w - EDGE_MARGIN) b.vx -= TURN_FACTOR;
        if (b.y < EDGE_MARGIN) b.vy += TURN_FACTOR;
        if (b.y > h - EDGE_MARGIN) b.vy -= TURN_FACTOR;

        const speed = Math.hypot(b.vx, b.vy);
        if (speed > MAX_SPEED) {
          b.vx = (b.vx / speed) * MAX_SPEED;
          b.vy = (b.vy / speed) * MAX_SPEED;
        } else if (speed < MIN_SPEED && speed > 0) {
          b.vx = (b.vx / speed) * MIN_SPEED;
          b.vy = (b.vy / speed) * MIN_SPEED;
        }

        b.x += b.vx;
        b.y += b.vy;
      }
    }

    function draw() {
      ctx.fillStyle = 'rgba(15, 17, 22, 0.18)';
      ctx.fillRect(0, 0, viewW(), viewH());

      for (const b of boids) {
        const angle = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(angle);
        ctx.fillStyle = `hsl(${b.hue}, 80%, 65%)`;
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-5, 4);
        ctx.lineTo(-5, -4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function loop() {
      step();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
